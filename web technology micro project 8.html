<!-- Insert inside the Bill Breakdown Modal Sheet before the Bill Calculations Table: -->

<div class="bg-surface-card rounded-2xl p-3 border border-surface-dim/80 space-y-2.5">
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-1.5">
      <span class="text-sm">👥</span>
      <h4 class="text-xs font-bold text-neutral-900">Split Bill with Friends</h4>
    </div>
    <!-- Stepper -->
    <div class="flex items-center gap-2 bg-surface-container px-2 py-0.5 rounded-lg border border-surface-dim">
      <button onclick="changeSplitCount(-1)" class="text-neutral-700 font-bold hover:text-brand px-1 text-sm">&minus;</button>
      <span id="splitCountDisplay" class="text-xs font-extrabold text-neutral-900 min-w-[16px] text-center">2</span>
      <span class="text-[10px] text-neutral-500 font-medium">people</span>
      <button onclick="changeSplitCount(1)" class="text-neutral-700 font-bold hover:text-brand px-1 text-sm">&plus;</button>
    </div>
  </div>

  <!-- Presets -->
  <div class="flex gap-1.5">
    <button onclick="setSplitCount(1)" class="split-pill px-2.5 py-1 rounded-lg text-[10px] font-bold bg-surface-container border border-surface-dim text-neutral-600">Solo (1)</button>
    <button onclick="setSplitCount(2)" class="split-pill active px-2.5 py-1 rounded-lg text-[10px] font-bold bg-brand text-white border border-brand">Pair (2)</button>
    <button onclick="setSplitCount(3)" class="split-pill px-2.5 py-1 rounded-lg text-[10px] font-bold bg-surface-container border border-surface-dim text-neutral-600">3 Friends</button>
    <button onclick="setSplitCount(4)" class="split-pill px-2.5 py-1 rounded-lg text-[10px] font-bold bg-surface-container border border-surface-dim text-neutral-600">4 Friends</button>
  </div>

  <!-- Calculated Output Box -->
  <div id="splitResultBox" class="bg-amber-50/70 border border-amber-200/80 rounded-xl p-2.5 flex items-center justify-between">
    <div>
      <p class="text-[10px] text-amber-800 font-medium">Each person pays:</p>
      <p class="font-serif text-base font-extrabold text-brand-dark leading-tight"><span id="perPersonAmount">₹63</span> <span class="text-[11px] font-normal text-neutral-500">/ person</span></p>
    </div>
    <button onclick="copySplitBreakdown()" class="px-2.5 py-1 bg-white border border-amber-300 text-brand-dark rounded-lg text-[10px] font-bold hover:bg-amber-50 flex items-center gap-1 shadow-2xs">
      <span>📤 Share Split</span>
    </button>
  </div>
</div>
